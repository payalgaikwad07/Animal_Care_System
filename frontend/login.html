<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Animal Shelter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>

<body>
  <div id="nav"></div>

  <main class="container py-4" style="max-width: 420px;">
    <h2>Login</h2>
    <form id="f">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="pass" class="form-control" required>
      </div>
      <div id="err" class="text-danger mb-2"></div>
      <button class="btn btn-primary w-100">Login</button>
    </form>
    <p class="mt-3">New here? <a href="/register.html">Register</a></p>
  </main>

  <script src="/js/common.js"></script>
  <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const r = await api('/api/login', 'POST', {
        email: document.getElementById('email').value,
        password: document.getElementById('pass').value
      });
      if (!r.ok) {
        document.getElementById('err').textContent = r.data.error || 'Login failed';
        return;
      }

      // Admin users go to the admin dashboard
      if (r.data.role !== 'user') {
        window.location = '/admin/index.html';
        return;
      }

      // Safe redirect check:
      // Must start with a single '/' and NOT '//' or '\\' (prevents open-redirect phishing)
      const params = new URLSearchParams(window.location.search);
      const next = params.get('next');
      const isSafeRedirect = next && next.startsWith('/') && !next.startsWith('//') && !next.includes('\\');

      window.location = isSafeRedirect ? next : '/index.html';
    });

  </script>
</body>

</html>
