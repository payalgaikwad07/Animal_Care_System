<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - Animal Shelter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>

  <main class="container py-4" style="max-width: 420px;">
    <h2>Register</h2>
    <form id="f">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" id="name" class="form-control" maxlength="100" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" maxlength="100" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Phone</label>
        <input type="tel" id="phone" class="form-control" maxlength="15" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Address</label>
        <input type="text" id="address" class="form-control" maxlength="255" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="pass" class="form-control" minlength="6" required>
      </div>
      <div id="err" class="text-danger mb-2"></div>
      <button class="btn btn-primary w-100">Register</button>
    </form>
    <p class="mt-3">Already registered? <a href="/login.html">Login</a></p>
  </main>

  <script src="/js/common.js"></script>
  <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const r = await api('/api/register', 'POST', {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        address: document.getElementById('address').value,
        password: document.getElementById('pass').value
      });
      if (!r.ok) {
        document.getElementById('err').textContent = r.data.error || 'Registration failed';
        return;
      }
      window.location = '/login.html';
    });
  </script>
</body>
</html>
