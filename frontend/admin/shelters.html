<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Shelters</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>

  <main class="container py-4">
    <ul class="nav nav-tabs mb-3">
      <li class="nav-item"><a class="nav-link" href="/admin/index.html">Animals</a></li>
      <li class="nav-item"><a class="nav-link" href="/admin/requests.html">Requests</a></li>
      <li class="nav-item"><a class="nav-link" href="/admin/staff.html">Staff</a></li>
      <li class="nav-item"><a class="nav-link active" href="/admin/shelters.html">Shelters</a></li>
    </ul>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2>Shelters</h2>
      <a class="btn btn-outline-primary btn-sm" href="/admin/staff.html">+ Add Shelter Admin</a>
    </div>

    <div id="msg"></div>

    <div class="table-responsive">
      <table class="table table-hover align-middle bg-white">
        <thead class="table-light">
          <tr>
            <th>Name</th>
            <th>City</th>
            <th>Address</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Capacity</th>
            <th>Animals</th>
            <th>Assigned Admin</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <!-- Global Admin shelter form -->
    <form id="f" class="card card-body mt-4">
      <h5 id="form-title">Add New Shelter</h5>
      <p class="text-muted small mb-2">Register a new physical shelter facility. Once added, you can assign a shelter admin to it.</p>
      <div id="err" class="text-danger mb-2"></div>
      <div class="row g-2">
        <div class="col-md-4">
          <input type="text" id="name" class="form-control" placeholder="Shelter Name" maxlength="100" required>
        </div>
        <div class="col-md-3">
          <input type="text" id="city" class="form-control" placeholder="City" maxlength="50" required>
        </div>
        <div class="col-md-5">
          <input type="text" id="address" class="form-control" placeholder="Address" maxlength="255" required>
        </div>
        <div class="col-md-3">
          <input type="text" id="phone" class="form-control" placeholder="Phone" maxlength="15" required>
        </div>
        <div class="col-md-4">
          <input type="email" id="email" class="form-control" placeholder="Email" maxlength="100">
        </div>
        <div class="col-md-2">
          <input type="number" id="capacity" class="form-control" placeholder="Capacity" value="50" min="1" required>
        </div>
        <div class="col-12 mt-2">
          <button class="btn btn-primary" id="save">Add Shelter</button>
        </div>
      </div>
    </form>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/admin-shelters.js"></script>
</body>
</html>
