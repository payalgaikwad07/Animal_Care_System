<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Donations & Donors</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>

  <main class="container py-4">
    <ul class="nav nav-tabs mb-3">
      <li class="nav-item"><a class="nav-link" href="/admin/index.html">Animals</a></li>
      <li class="nav-item"><a class="nav-link" href="/admin/requests.html">Requests</a></li>
      <li class="nav-item"><a class="nav-link" href="/admin/staff.html">Staff</a></li>
      <li class="nav-item"><a class="nav-link active" href="/admin/donations.html">Donations</a></li>
      <li class="nav-item d-none" id="shelters-tab"><a class="nav-link" href="/admin/shelters.html">Shelters</a></li>
    </ul>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2>Donations & Donors</h2>
    </div>

    <!-- Summary metrics cards -->
    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card border-0 shadow-sm bg-light p-3">
          <span class="text-muted small fw-semibold">Total Funds Received</span>
          <h3 class="mb-0 text-success fw-bold" id="stat-total">₹0</h3>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card border-0 shadow-sm bg-light p-3">
          <span class="text-muted small fw-semibold">Total Donations</span>
          <h3 class="mb-0 text-primary fw-bold" id="stat-count">0</h3>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card border-0 shadow-sm bg-light p-3">
          <span class="text-muted small fw-semibold">Unique Donors</span>
          <h3 class="mb-0 text-dark fw-bold" id="stat-donors">0</h3>
        </div>
      </div>
    </div>

    <!-- Search & Filters -->
    <form id="filters" class="row g-2 mb-3">
      <div class="col-md-4">
        <input type="text" id="f-search" class="form-control" placeholder="Search by donor name, email or phone">
      </div>
      <div class="col-md-3 d-none" id="shelter-box">
        <select id="f-shelter" class="form-select">
          <option value="">All shelters</option>
        </select>
      </div>
      <div class="col-md-auto">
        <button class="btn btn-dark">Search</button>
        <button type="button" class="btn btn-outline-secondary" id="clear">Clear</button>
      </div>
    </form>

    <div id="msg"></div>
    <p id="count" class="text-muted small"></p>

    <div class="table-responsive">
      <table class="table table-hover align-middle bg-white">
        <thead class="table-light">
          <tr>
            <th>Ref ID</th>
            <th>Donor Name</th>
            <th>Contact</th>
            <th>Amount</th>
            <th>Date</th>
            <th>Shelter</th>
            <th>Address</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/admin-donations.js"></script>
</body>
</html>
