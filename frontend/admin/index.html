<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Animals</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>

  <main class="container py-4">
    <ul class="nav nav-tabs mb-3">
      <li class="nav-item"><a class="nav-link active" href="/admin/index.html">Animals</a></li>
      <li class="nav-item"><a class="nav-link" href="/admin/requests.html">Requests</a></li>
    </ul>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="mb-0">Animals</h2>
      <a class="btn btn-primary" href="/admin/animal-form.html">+ Add Animal</a>
    </div>

    <form id="filters" class="row g-2 mb-3">
      <div class="col-md-3">
        <input type="text" id="f-name" class="form-control" placeholder="Search by name">
      </div>
      <div class="col-md-2">
        <select id="f-status" class="form-select">
          <option value="">All statuses</option>
          <option>Available</option>
          <option>Under Treatment</option>
          <option>Fostered</option>
          <option>Adopted</option>
        </select>
      </div>
      <div class="col-md-2">
        <select id="f-species" class="form-select">
          <option value="">All species</option>
        </select>
      </div>
      <div class="col-md-3 d-none" id="shelter-box">
        <select id="f-shelter" class="form-select">
          <option value="">All shelters</option>
        </select>
      </div>
      <div class="col-md-auto d-flex align-items-center">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="f-due">
          <label class="form-check-label" for="f-due">Vaccination due in 30 days</label>
        </div>
      </div>
      <div class="col-md-auto">
        <button class="btn btn-dark">Search</button>
        <button type="button" class="btn btn-outline-secondary" id="clear">Clear</button>
      </div>
    </form>

    <div id="err" class="text-danger mb-2"></div>
    <p id="count" class="text-muted"></p>

    <div class="table-responsive">
      <table class="table table-hover align-middle bg-white">
        <thead class="table-light">
          <tr>
            <th>ID</th><th>Name</th><th>Species</th><th>Breed</th><th>Age</th>
            <th>Gender</th><th>Status</th><th>Shelter</th><th>Intake</th><th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/admin-animals.js"></script>
</body>
</html>
