<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Staff</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>

  <main class="container py-4">
    <ul class="nav nav-tabs mb-3">
      <li class="nav-item"><a class="nav-link" href="/admin/index.html">Animals</a></li>
      <li class="nav-item"><a class="nav-link" href="/admin/requests.html">Requests</a></li>
      <li class="nav-item"><a class="nav-link active" href="/admin/staff.html">Staff</a></li>
      <li class="nav-item"><a class="nav-link" href="/admin/donations.html">Donations</a></li>
      <li class="nav-item d-none" id="shelters-tab"><a class="nav-link" href="/admin/shelters.html">Shelters</a></li>
    </ul>

    <h2>Staff</h2>

    <div class="col-md-3 mb-3 d-none" id="shelter-box">
      <select id="f-shelter" class="form-select">
        <option value="">All shelters</option>
      </select>
    </div>

    <div id="msg"></div>

    <div class="table-responsive">
      <table class="table table-hover align-middle bg-white">
        <thead class="table-light">
          <tr><th>Name</th><th>Role</th><th>Email</th><th>Phone</th><th>Shelter</th><th>Can log in</th><th></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <form id="f" class="card card-body mt-4 d-none">
      <h5 id="form-title">Add staff member</h5>
      <p id="form-desc" class="text-muted small mb-2">Staff added here do not get a login. They appear in the "Examined by" list for medical records.</p>
      <div id="err" class="text-danger mb-2"></div>
      <div class="row g-2">
        <div class="col-md-4">
          <input type="text" id="name" class="form-control" placeholder="Name" maxlength="100" required>
        </div>
        <div class="col-md-2" id="role-input-group">
          <select id="role" class="form-select" required>
            <option>Vet</option>
            <option>Caretaker</option>
          </select>
        </div>
        <div class="col-md-3">
          <input type="email" id="email" class="form-control" placeholder="Email" maxlength="100" required>
        </div>
        <div class="col-md-3">
          <input type="text" id="phone" class="form-control" placeholder="Phone" maxlength="15">
        </div>
        <div class="col-md-4 d-none" id="shelter-input-group">
          <select id="staff-shelter" class="form-select">
            <option value="">Choose Shelter</option>
          </select>
        </div>
        <div class="col-md-4 d-none" id="password-input-group">
          <input type="password" id="staff-password" class="form-control" placeholder="Temporary password (min 6 chars)" minlength="6">
        </div>
        <div class="col-12 mt-2">
          <button class="btn btn-primary" id="save">Add</button>
          <button type="button" class="btn btn-outline-secondary d-none" id="cancel">Cancel</button>
        </div>
      </div>
    </form>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/admin-staff.js"></script>
</body>
</html>
