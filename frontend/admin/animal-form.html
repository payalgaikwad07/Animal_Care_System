<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Animal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>

  <main class="container py-4" style="max-width: 800px;">
    <a href="/admin/index.html">&larr; Back to animals</a>
    <h2 class="mt-2" id="title">Add Animal</h2>
    <div id="err" class="text-danger mb-2"></div>

    <form id="f">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Name</label>
          <input type="text" id="name" class="form-control" maxlength="50" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Species</label>
          <input type="text" id="species" class="form-control" list="species-list" maxlength="30" required>
          <datalist id="species-list"></datalist>
        </div>
        <div class="col-md-6">
          <label class="form-label">Breed</label>
          <input type="text" id="breed" class="form-control" maxlength="50">
        </div>
        <div class="col-md-3">
          <label class="form-label">Age (months)</label>
          <input type="number" id="age" class="form-control" min="0" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Gender</label>
          <select id="gender" class="form-select" required>
            <option value="">Choose</option>
            <option>Male</option>
            <option>Female</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Status</label>
          <select id="status" class="form-select">
            <option>Available</option>
            <option>Under Treatment</option>
          </select>
          <div id="status-note" class="form-text d-none">Adopted and fostered animals are changed from the requests screen.</div>
        </div>
        <div class="col-md-4">
          <label class="form-label">Intake date</label>
          <input type="date" id="intake" class="form-control" required>
        </div>
        <div class="col-md-4 d-none" id="shelter-box">
          <label class="form-label">Shelter</label>
          <select id="shelter" class="form-select">
            <option value="">Choose a shelter</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label">Photo link (URL)</label>
          <input type="text" id="image" class="form-control" maxlength="255" placeholder="/images/animals/bruno.jpg">
        </div>
        <div class="col-12">
          <label class="form-label">Notes</label>
          <textarea id="notes" class="form-control" rows="3"></textarea>
        </div>
      </div>

      <!-- Add mode only: first medical record and vaccinations -->
      <div id="add-only">
        <hr class="my-4">
        <h5>Medical condition (optional)</h5>
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Visit date</label>
            <input type="date" id="visit" class="form-control">
          </div>
          <div class="col-md-8">
            <label class="form-label">Diagnosis</label>
            <input type="text" id="diag" class="form-control" maxlength="255">
          </div>
          <div class="col-md-8">
            <label class="form-label">Treatment</label>
            <input type="text" id="treat" class="form-control" maxlength="255">
          </div>
          <div class="col-md-4">
            <label class="form-label">Examined by</label>
            <select id="staff" class="form-select">
              <option value="">Not recorded</option>
            </select>
          </div>
        </div>

        <h5 class="mt-4">Vaccinations (optional)</h5>
        <div id="vac"></div>
        <button type="button" class="btn btn-outline-secondary btn-sm" id="add-vac">+ Add vaccine</button>
      </div>

      <div class="mt-4">
        <button class="btn btn-primary">Save</button>
        <a class="btn btn-outline-secondary" href="/admin/index.html">Cancel</a>
      </div>
    </form>

    <!-- Edit mode only: history, read-only -->
    <div id="records" class="d-none mt-5"></div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/admin-animal-form.js"></script>
  <script src="/js/admin-records.js"></script>
</body>
</html>
