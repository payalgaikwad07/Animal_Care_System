<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Requests</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>

  <main class="container py-4">
    <ul class="nav nav-tabs mb-3">
      <li class="nav-item"><a class="nav-link" href="/admin/index.html">Animals</a></li>
      <li class="nav-item"><a class="nav-link active" href="/admin/requests.html">Requests</a></li>
      <li class="nav-item"><a class="nav-link" href="/admin/staff.html">Staff</a></li>
      <li class="nav-item d-none" id="shelters-tab"><a class="nav-link" href="/admin/shelters.html">Shelters</a></li>
    </ul>

    <h2>Adoption and Foster Requests</h2>

    <form id="filters" class="row g-2 mb-3">
      <div class="col-md-3">
        <select id="f-type" class="form-select">
          <option value="">Adoption and foster</option>
          <option value="adoption">Adoption only</option>
          <option value="foster">Foster only</option>
        </select>
      </div>
      <div class="col-md-3">
        <select id="f-status" class="form-select">
          <option value="Pending" selected>Pending</option>
          <option value="">All statuses</option>
          <option>Approved</option>
          <option>Rejected</option>
          <option>Ended</option>
        </select>
      </div>
      <div class="col-md-3 d-none" id="shelter-box">
        <select id="f-shelter" class="form-select">
          <option value="">All shelters</option>
        </select>
      </div>
    </form>

    <div id="msg"></div>
    <p id="count" class="text-muted"></p>

    <div class="table-responsive">
      <table class="table table-hover align-middle bg-white">
        <thead class="table-light">
          <tr>
            <th>Type</th><th>Animal</th><th>Applicant</th><th>Contact</th>
            <th>Requested</th><th>Details</th><th>Status</th><th>Shelter</th><th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/admin-requests.js"></script>
</body>
</html>
